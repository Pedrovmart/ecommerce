<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/layout/layout.xhtml">

    <ui:define name="content">
        <div class="container mt-5">
            <h2 class="text-center mb-4">Página de Login</h2>

            <div class="row">
                <!-- Formulário de Login -->
                <div class="col-md-6 offset-md-3">
                    <h3>Login</h3>
                    <h:form>
                        <div class="mb-3">
                            <h:outputLabel value="E-mail:" for="emailLogin" />
                            <h:inputText id="emailLogin" styleClass="form-control" value="#{loginPage.username}" />
                        </div>
                        <div class="mb-3">
                            <h:outputLabel value="Senha:" for="senhaLogin" />
                            <h:inputSecret id="senhaLogin" styleClass="form-control" value="#{loginPage.password}" />
                        </div>
                        <!-- Botão de Login -->
                        <h:commandButton value="Login" type="submit" action="#{loginPage.login}" ajax="false" styleClass="btn btn-primary" />
                        <h:messages styleClass="text-danger mt-2" />
                        <h:messages styleClass="text-success mt-3" />
                    </h:form>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
