<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/layout/layout.xhtml">

    <ui:define name="content">
        <div class="container mt-5 d-flex justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-10">
                <!-- Título da Página -->
                <h2 class="text-center mb-5">Bem-vindo! Faça Login</h2>

                <!-- Formulário de Login -->
                <div class="card mb-4">
                    <div class="card-header text-center">
                        <h3>Login</h3>
                    </div>
                    <div class="card-body">
                        <h:form>
                            <h:panelGrid columns="1" styleClass="form-grid">
                                <div class="mb-3">
                                    <h:outputLabel for="emailLogin" value="E-mail:" />
                                    <h:inputText id="emailLogin" styleClass="form-control" />
                                </div>

                                <div class="mb-3">
                                    <h:outputLabel for="senhaLogin" value="Senha:" />
                                    <h:inputSecret id="senhaLogin" styleClass="form-control" />
                                </div>


                                <div class="text-center">
                                    <h:commandButton value="Login" action="produtos?faces-redirect=true" styleClass="btn btn-primary w-100" />
                                </div>
                            </h:panelGrid>
                        </h:form>
                    </div>
                </div>

                <!-- Botão para exibir o formulário de Cadastro -->
                <div class="text-center mb-4">
                    <button class="btn btn-success w-100" onclick="document.getElementById('formCadastro').style.display='block'; this.style.display='none';">
                        Não tem conta? Cadastre-se
                    </button>
                </div>

                <!-- Formulário de Cadastro (oculto inicialmente) -->
                <div id="formCadastro" style="display: none;">
                    <div class="card">
                        <div class="card-header text-center">
                            <h3>Cadastro</h3>
                        </div>
                        <div class="card-body">
                            <h:form>
                                <h:panelGrid columns="1" styleClass="form-grid">
                                    <div class="mb-3">
                                        <h:outputLabel for="nomeCadastro" value="Nome:" />
                                        <h:inputText id="nomeCadastro" styleClass="form-control" />
                                    </div>

                                    <div class="mb-3">
                                        <h:outputLabel for="emailCadastro" value="E-mail:" />
                                        <h:inputText id="emailCadastro" styleClass="form-control" />
                                    </div>

                                    <div class="mb-3">
                                        <h:outputLabel for="senhaCadastro" value="Senha:" />
                                        <h:inputSecret id="senhaCadastro" styleClass="form-control" />
                                    </div>

                                    <div class="text-center">
                                        <h:commandButton value="Cadastrar" action="produtos?faces-redirect=true" styleClass="btn btn-success w-100" />
                                    </div>
                                </h:panelGrid>
                            </h:form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
